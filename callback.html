<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting… - Zhu Video Publisher</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 560px; margin: 80px auto; padding: 0 20px; color: #161823;
         text-align: center; }
  .err { color: #d33; }
  a { color: #fe2c55; }
</style>
</head>
<body>
<h1 style="font-size:20px">Zhu Video Publisher</h1>
<div id="msg"><p>Returning to the publisher…</p></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('code')) {
    // Hand the authorization result back to the publisher page (same origin),
    // which verifies `state` and exchanges the code through the backend.
    location.replace('publisher.html?' + q.toString());
    return;
  }
  var err = q.get('error') || 'no_code';
  var desc = q.get('error_description') || '';
  var p = document.createElement('p');
  p.className = 'err';
  p.textContent = 'Authorization was not completed: ' + err + (desc ? ' - ' + desc : '');
  var back = document.createElement('p');
  back.innerHTML = '<a href="publisher.html">Back to the publisher</a>';
  var msg = document.getElementById('msg');
  msg.innerHTML = '';
  msg.appendChild(p); msg.appendChild(back);
})();
</script>
</body>
</html>
